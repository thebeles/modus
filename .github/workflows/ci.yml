name: Verify
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modus
          POSTGRES_PASSWORD: modus_dev
          POSTGRES_DB: kontur_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modus -d kontur_integration"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/kontur_integration?schema=public
      TEST_DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/kontur_integration?schema=public
      E2E_DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/kontur_e2e?schema=public
      WEB_ORIGIN: http://localhost:5173
      DEMO_MODE: "true"
      SEED_DEMO_USERS: "true"
      GROQ_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose config --quiet
      - run: pnpm db:migrate && pnpm db:seed && pnpm db:seed
      - run: pnpm test:integration
      - run: docker exec "$POSTGRES_CONTAINER" psql -U modus -d postgres -c 'CREATE DATABASE kontur_e2e'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm --filter @kontur/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
