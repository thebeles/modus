name: Verify
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modus
          POSTGRES_PASSWORD: modus_dev
          POSTGRES_DB: modus_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modus -d modus_integration"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PNPM_VERSION: "11.25.0"
      DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/modus_integration?schema=public
      TEST_DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/modus_integration?schema=public
      E2E_DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/modus_e2e?schema=public
      WEB_ORIGIN: http://localhost:5173
      DEMO_MODE: "true"
      SEED_DEMO_USERS: "true"
      GROQ_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up pnpm
        run: |
          # Corepack selects pnpm before pnpm processes -C.
          corepack install --global "pnpm@$PNPM_VERSION"
          corepack enable pnpm
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Locate pnpm store
        id: pnpm
        working-directory: backend
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('backend/pnpm-lock.yaml', 'frontend/pnpm-lock.yaml') }}
      - run: pnpm -C backend install --frozen-lockfile
      - run: pnpm -C frontend install --frozen-lockfile
      - run: git diff --no-index --ignore-cr-at-eol backend/src/contracts.ts frontend/src/contracts.ts
      - run: pnpm -C backend lint && pnpm -C frontend lint
      - run: pnpm -C backend typecheck && pnpm -C frontend typecheck
      - run: pnpm -C backend test
      - run: pnpm -C backend build && pnpm -C frontend build
      - run: docker compose -f backend/deploy/docker-compose.yml config --quiet
      - run: docker compose -f backend/deploy/docker-compose.production.yml config --quiet
        env:
          WEB_ORIGIN: https://modus.example.invalid
          DATABASE_URL: postgresql://runtime:validation@db.example.invalid/modus
          MIGRATION_DATABASE_URL: postgresql://migrator:validation@db.example.invalid/modus
      - run: docker compose -f backend/deploy/docker-compose.yml build api web
      - run: pnpm -C backend db:migrate && pnpm -C backend db:seed && pnpm -C backend db:seed
      - run: pnpm -C backend test:integration
      - run: docker exec "$POSTGRES_CONTAINER" psql -U modus -d postgres -c 'CREATE DATABASE modus_ci_load'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm -C backend db:migrate && pnpm -C backend db:seed && pnpm -C backend test:load
        env:
          DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/modus_ci_load?schema=public
          TEST_DATABASE_URL: postgresql://modus:modus_dev@localhost:5432/modus_ci_load?schema=public
          LOAD_P95_MS: "5000"
      - run: docker exec "$POSTGRES_CONTAINER" psql -U modus -d postgres -c 'CREATE DATABASE modus_e2e'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm -C backend db:migrate && pnpm -C backend db:seed
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm -C frontend exec playwright install --with-deps chromium
      - run: pnpm -C frontend test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
